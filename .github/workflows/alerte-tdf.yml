name: Alerte TDF

# Se declenche toutes les 5 minutes, uniquement pendant la periode du Tour
# de France 2026 (4-26 juillet) et pendant la plage horaire ou les etapes
# se terminent generalement (12h-19h UTC = 14h-21h heure de Paris).
# A adapter chaque annee (dates du Tour + fuseau horaire ete/hiver).
on:
  schedule:
    - cron: "2-59/5 12-19 4-26 7 *"
  workflow_dispatch: {}

jobs:
  check-distance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Verifier la distance restante et notifier si besoin
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Sauvegarder l'etat (evite les notifications en double)
        run: |
          git config user.name "alerte-tdf-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f state/last_notified.txt ]; then
            git add state/last_notified.txt
            git diff --cached --quiet || git commit -m "chore: update notification state"
          else
            echo "Pas de fichier d'etat a sauvegarder (aucune notification envoyee ce run)."
          fi
          git push || true
